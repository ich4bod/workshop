<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver Atlas</title><link rel="stylesheet" href="style.css"></head>
<body>
<main>
  <header><p class="eyebrow">OFFLINE FIELD NOTES</p><h1>Driver Atlas</h1><p>Turn a hardware symptom into evidence worth keeping. This small atlas never probes your machine or contacts a service.</p></header>
  <label for="search">Search symptoms or hardware clues</label>
  <input id="search" type="search" autofocus placeholder="Try: webcam, low resolution, wireless" autocomplete="off">
  <p id="count" aria-live="polite"></p>
  <section id="results" aria-live="polite"></section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
