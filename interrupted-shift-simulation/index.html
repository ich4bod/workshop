<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Third Bell — an interrupted shift</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="machine-shell">
    <header><p class="eyebrow">BLACKOUT GARDEN / NIGHT OPERATOR 04</p><h1>The Third Bell</h1><p class="subtitle">Keep a small weather machine alive across three wake-ups. Only what you deliberately leave behind survives the bell.</p></header>
    <section class="dashboard" aria-label="Machine state">
      <div><span>GRID</span><strong id="grid">—</strong></div><div><span>GARDEN TRUST</span><strong id="trust">—</strong></div><div><span>YOUR NOTES</span><strong id="notes-count">—</strong></div>
    </section>
    <section id="game" aria-live="polite"></section>
    <footer><span id="shift-stamp">SHIFT 01</span><button id="reset" type="button">Start over</button><span>Every restart has a cost.</span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
